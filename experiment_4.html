<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment-4</title>
    </head>
        <body>
            <h1><b><center>Hotel Room Booking Form</center></b></h1>
            <center>
                <form action="experiment_4.html" method="post">
                    <label for="name"><b>Full Name:</b></label>
                        <input type="text" id="name" name="Full Name:" required><br><br>
                    <label for="email"><b>Email:</b></label>
                        <input type="email" id="email" name="Email:" required><br><br>
                    <label for="phone"><b>Phone:</b></label>
                        <input type="tel" id="phone" name="Phone:" required><br><br>
                    <label for="date"><b>Check-in Date:</b></label>
                        <input type="date" id="date" name="Check-in Date:" required><br><br>
                    <label for="date"><b>Check-out Date:</b></label>
                        <input type="date" id="date" name="Check-out Date:" required><br><br>
                    <label for="room"><b>Room Type:</b></label>
                        <select id="room" name="Room Type:" required>
                            <option value="single">Single Room</option>
                            <option value="double">Double Room</option>
                            <option value="suite">Suite Room</option>
                        </select><br><br>
                    <label for="guests"><b>Number of Guests:</b></label>
                        <input type="number" id="guests" name="Number of Guests:" min="1" max="50" required><br><br>
                    <label for="message"><b>Special Requests:</b></label><br>
                        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
                            <button type="submit">Book Now</button>
                            <button type="reset">Reset Form</button>
                </form>
            </center>
        </body>
</html>
