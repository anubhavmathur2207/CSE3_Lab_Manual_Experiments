<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Experiment-5</title>
    </head>
        <body>
            <h1><b><center>Student Registration Form</center></b></h1><hr>
            <form action="experiment_5.html" method="post">
                <label for="name"><b>Full Name:</b></label>
                    <input type="text" id="name" name="Full Name:" placeholder="Enter your full name" required><br><br>
                <label for="email"><b>Email:</b></label>
                    <input type="email" id="email" name="Email:" placeholder="Enter valid email address" required><br><br>
                <label for="password"><b>Password:</b></label>
                    <input type="password" id="password" name="Password:" placeholder="Enterpassword" required><br><br>
                <label for="dob"><b>Date of Birth:</b></label>
                    <input type="date" id="dob" name="Date of Birth:" required><br><br>
                <label for="gender"><b>Gender:</b></label>
                    <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label><br><br>
                <label for="course"><b>Course:</b></label>
                    <select id="course" name="Course:" required>
                        <option value="">--Select Course--</option>
                        <option value="cs">Computer Science</option>
                        <option value="ee">Electrical Engineering</option>
                        <option value="me">Mechanical Engineering</option>
                        <option value="ce">Civil Engineering</option>
                    </select><br><br>
                    <label for="phone"><b>Contact Number:</b></label>
                    <input type="tel" id="phone" name="Contact Number:" placeholder="Enter phone number" required><br><br>
                    <label for="address"><b>Address:</b></label><br>
                    <textarea id="address" name="Address:" rows="4" cols="50" placeholder="Enter your address"></textarea><br><br>
                        <button type="submit">Register</button>
                        <button type="reset">Clear</button>
            </form><hr>
            <h2><center>&copy; 2026 Student Registration Portal</center></h2>
        </body>
</html>
